[project]
name = "comfyui-discord-bot"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["workflows"]

[tool.ruff.lint]
# Conservative on purpose: only the rules the code already satisfies (plus
# import sorting) are enforced, so a tightening pass can land as its own
# commit. Formatting is enforced separately (`ruff format --check`).
select = ["E4", "E7", "E9", "F", "I", "UP032", "UP035"]
ignore = [
    # Imports follow the logger/config setup in core.py, bot.py and diag.py on
    # purpose: those modules must configure logging and read config first, and
    # bot.py imports cogs/views late to avoid an import cycle.
    "E402",
    # core.py and bot.py re-export names that cogs import from them.
    "F401",
]

[tool.ruff.lint.isort]
known-first-party = [
    "bot", "cogs", "comfyui_client", "config_loader", "core", "db",
    "generation_store", "job_queue", "llm_client", "moderation", "nsfw_guard",
    "ui", "user_settings", "workflow",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = """
-q
--cov=workflow --cov=job_queue --cov=db
--cov=generation_store --cov=user_settings --cov=moderation
--cov-report=term-missing:skip-covered
--cov-fail-under=80
"""
