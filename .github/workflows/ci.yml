name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      # The test suite is offline: it stubs `core`, so the heavy runtime
      # dependencies (discord.py, aiohttp, onnxruntime) are not installed.
      # Coverage is configured in pyproject.toml (80% floor).
      - run: pytest
